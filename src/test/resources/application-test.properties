# Perfil usado pelos testes @DataJpaTest / @SpringBootTest — roda em H2 em memória,
# sem depender de variáveis de ambiente (DB_URL, JWT_SECRET etc.) do ambiente local.

# H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Schema gerado pelo Hibernate a partir das entities (as migrations do Flyway são específicas do Postgres)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (segredo de teste, nunca usado fora dos testes)
security.jwt.secret=uO4esMFBh12md6KkXNSa36cP7OoVIiqAhIoI3dpxY5E=
security.jwt.expiration=86400000

# Cloudinary (dummy — nenhum teste faz upload real)
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test

# Admin inicial (dummy)
ADMIN_EMAIL=admin@test.com
ADMIN_PASSWORD=test-password
