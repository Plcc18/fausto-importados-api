# Perfil usado pelos testes @DataJpaTest / @SpringBootTest — roda em H2 em memória,
# sem depender de variáveis de ambiente (DB_URL, JWT_SECRET etc.) do ambiente local.

spring:
  # H2 em memória
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    hikari:
      # lock_timeout e do PostgreSQL; os testes com Postgres o definem (ver TestPostgres)
      connection-init-sql: "SELECT 1"

  # Schema gerado pelo Hibernate a partir das entities (as migrations do Flyway são específicas do Postgres)
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# JWT (segredo de teste, nunca usado fora dos testes)
security:
  jwt:
    secret: "uO4esMFBh12md6KkXNSa36cP7OoVIiqAhIoI3dpxY5E="
  # Chave de teste (32 bytes em base64), nunca usada fora dos testes
  totp:
    encryption-key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
  # Prazos de produção (os testes avançam o tempo com um Clock controlável)
  auth:
    # Os testes de fluxo de sessão não exercitam o 2FA; os de 2FA ligam de novo (ver MfaFlowTest)
    mfa-required: false
    access-ttl: PT15M
    refresh-inactivity: P7D
    refresh-absolute: P30D
    refresh-grace: PT10S
  # Limites altíssimos: os testes de outros assuntos fazem muitos logins/requisições. Os testes de rate limit
  # (RateLimitTest) sobrescrevem estes valores.
  rate-limit:
    store: memory
    redis-url: ""
    trusted-proxy-hops: 1
    login-ip: 100000/1m
    login-email: 100000/1m
    login-admin-email: 100000/1m
    refresh: 100000/1m
    public-write: 100000/1m
    api-user: 100000/1m
    api-anon: 100000/1m
    public-read: 100000/1m

# Cloudinary (dummy — nenhum teste faz upload real)
cloudinary:
  cloud_name: test
  api_key: test
  api_secret: test

# Admin inicial (dummy)
ADMIN_EMAIL: admin@test.com
ADMIN_PASSWORD: test-password
