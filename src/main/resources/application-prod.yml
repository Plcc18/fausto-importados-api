# App
spring:
  application:
    name: fausto-importados-api

  # PostgreSQL
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${PORT:8080}"
  address: 0.0.0.0

# JWT
security:
  jwt:
    secret: "${JWT_SECRET}"
    expiration: "${JWT_EXPIRATION:86400000}"

# Cloudinary
cloudinary:
  cloud_name: "${CLOUDINARY_NAME}"
  api_key: "${CLOUDINARY_KEY}"
  api_secret: "${CLOUDINARY_SECRET}"

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Admin
ADMIN_EMAIL: "${ADMIN_EMAIL}"
ADMIN_PASSWORD: "${ADMIN_PASSWORD}"

# Logging menos verboso em producao
logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cookie:
    secure: true
    same-site: "None"
