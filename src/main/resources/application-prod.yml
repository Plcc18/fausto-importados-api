# App
spring:
  application:
    name: fausto-importados-api

  # PostgreSQL
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${PORT:8080}"
  address: 0.0.0.0

# JWT
security:
  jwt:
    secret: "${JWT_SECRET}"
  # 2FA (TOTP): chave AES-256 (base64, 32 bytes) que cifra os segredos em repouso. OBRIGATÓRIA.
  # Gere com: openssl rand -base64 32. Perder esta chave obriga todos os admins a refazer o 2FA.
  totp:
    encryption-key: "${TOTP_ENCRYPTION_KEY:}"
  auth:
    access-ttl: "${JWT_ACCESS_TTL:PT15M}"
    refresh-inactivity: "${REFRESH_INACTIVITY:P7D}"
    refresh-absolute: "${REFRESH_ABSOLUTE:P30D}"
    refresh-grace: "${REFRESH_GRACE:PT10S}"
  rate-limit:
    # Só o Render fica na frente da API: o navegador chama a API direto e o Render acrescenta o IP de quem conectou
    # ao FIM de X-Forwarded-For. O IP de quem passa pela Vercel (/auth/*) vem por X-Client-IP + PROXY_SHARED_SECRET.
    trusted-proxy-hops: "${TRUSTED_PROXY_HOPS:1}"

# Cloudinary
cloudinary:
  cloud_name: "${CLOUDINARY_NAME}"
  api_key: "${CLOUDINARY_KEY}"
  api_secret: "${CLOUDINARY_SECRET}"

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Admin
ADMIN_EMAIL: "${ADMIN_EMAIL:}"
ADMIN_PASSWORD: "${ADMIN_PASSWORD:}"

# Logging menos verboso em producao
logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: WARN
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cookie:
    secure: true
    # Strict exige que o browser veja o /auth como same-origin com o front: na Vercel isso é feito
    # pelo rewrite de /auth/* (vercel.json), que repassa o cookie para o domínio do próprio front.
    same-site: "Strict"
