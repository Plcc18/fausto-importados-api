# App
spring:
  application:
    name: fausto-importados-api

  # PostgreSQL
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${PORT:8080}"

# Spring Security (logs)
logging:
  level:
    org.springframework.security: DEBUG

# JWT
security:
  jwt:
    secret: "${JWT_SECRET}"
    expiration: "${JWT_EXPIRATION:86400000}"

# Cloudinary
cloudinary:
  cloud_name: "${CLOUDINARY_NAME}"
  api_key: "${CLOUDINARY_KEY}"
  api_secret: "${CLOUDINARY_SECRET}"

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

ADMIN_EMAIL: "${ADMIN_EMAIL}"
ADMIN_PASSWORD: "${ADMIN_PASSWORD}"

# spring.profiles.active: dev

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

