# App
spring:
  application:
    name: fausto-importados-api

  # Carrega variáveis do arquivo .env (se existir) — útil em desenvolvimento local
  config:
    import: "optional:file:.env[.properties]"

  # PostgreSQL
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari:
      # Nenhuma transação espera um lock para sempre; a que estourar é repetida (ver Transactions)
      connection-init-sql: "${DB_CONNECTION_INIT_SQL:SET lock_timeout = '5s'}"

  # JPA / Hibernate
  jpa:
    # Cada transação lê dados frescos: sem isto, um SELECT ... FOR UPDATE poderia reaproveitar uma cópia antiga
    # carregada antes na mesma requisição
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # SQL no log só no profile dev (application-dev.yml); o padrão não despeja consultas nos logs de produção
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${PORT:8080}"

# Logs: DEBUG do Spring Security só no profile dev (application-dev.yml)
logging:
  level:
    org.springframework.security: INFO

# JWT
security:
  jwt:
    secret: "${JWT_SECRET}"
  # 2FA (TOTP): chave AES-256 (base64, 32 bytes) que cifra os segredos em repouso. OBRIGATÓRIA.
  # Gere com: openssl rand -base64 32. Perder esta chave obriga todos os admins a refazer o 2FA.
  totp:
    encryption-key: "${TOTP_ENCRYPTION_KEY:}"
  # Proxy do front (função da Vercel que repassa /auth/*). A Vercel não entrega o IP do visitante a quem recebe o
  # rewrite; a função o repassa em X-Client-IP junto com este segredo. Vazio = recurso desligado. Mínimo 32 caracteres.
  # Gere com: openssl rand -base64 32. require-for-auth=true faz /auth/** responder 404 a quem não trouxer o segredo.
  proxy:
    shared-secret: "${PROXY_SHARED_SECRET:}"
    require-for-auth: "${PROXY_REQUIRE_FOR_AUTH:false}"
  # Access token curto + refresh token com sessão deslizante (valores ISO-8601)
  auth:
    access-ttl: "${JWT_ACCESS_TTL:PT15M}"
    refresh-inactivity: "${REFRESH_INACTIVITY:P7D}"
    refresh-absolute: "${REFRESH_ABSOLUTE:P30D}"
    refresh-grace: "${REFRESH_GRACE:PT10S}"
  # Rate limiting. Cada regra é <máximo>/<janela> (ex.: 5/15m, 100/1m, 3/1h). Ver README.
  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    # auto = Redis se REDIS_URL existir; senão memória (dev/teste) ou Postgres. Também: redis | jdbc | memory
    store: "${RATE_LIMIT_STORE:auto}"
    redis-url: "${REDIS_URL:}"
    # Quantos proxies seus ficam na frente da API (0 = ignora X-Forwarded-For). Render = 1 (ver application-prod.yml)
    trusted-proxy-hops: "${TRUSTED_PROXY_HOPS:1}"
    login-ip: "${RATE_LIMIT_LOGIN_IP:5/15m}"
    login-email: "${RATE_LIMIT_LOGIN_EMAIL:5/15m}"
    login-admin-email: "${RATE_LIMIT_LOGIN_ADMIN_EMAIL:3/15m}"
    refresh: "${RATE_LIMIT_REFRESH:30/1m}"
    public-write: "${RATE_LIMIT_PUBLIC_WRITE:3/1h}"
    api-user: "${RATE_LIMIT_API_USER:100/1m}"
    api-anon: "${RATE_LIMIT_API_ANON:60/1m}"
    public-read: "${RATE_LIMIT_PUBLIC_READ:120/1m}"

# Concorrência. Ligue os dois "require" só depois que o front enviar o cabeçalho Idempotency-Key e o campo version.
app:
  concurrency:
    require-idempotency-key: "${REQUIRE_IDEMPOTENCY_KEY:false}"
    require-version: "${REQUIRE_VERSION:false}"

# Cloudinary
cloudinary:
  cloud_name: "${CLOUDINARY_NAME}"
  api_key: "${CLOUDINARY_KEY}"
  api_secret: "${CLOUDINARY_SECRET}"

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

ADMIN_EMAIL: "${ADMIN_EMAIL:}"
ADMIN_PASSWORD: "${ADMIN_PASSWORD:}"

# spring.profiles.active: dev

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

