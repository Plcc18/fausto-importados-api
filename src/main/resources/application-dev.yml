# PostgreSQL
spring:
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

# Spring Security (logs)
logging:
  level:
    org.springframework.security: DEBUG

# JWT
security:
  jwt:
    secret: "${JWT_SECRET}"
  auth:
    access-ttl: "${JWT_ACCESS_TTL:PT15M}"
    refresh-inactivity: "${REFRESH_INACTIVITY:P7D}"
    refresh-absolute: "${REFRESH_ABSOLUTE:P30D}"
    refresh-grace: "${REFRESH_GRACE:PT10S}"

# Cloudinary
cloudinary:
  cloud_name: "${CLOUDINARY_NAME}"
  api_key: "${CLOUDINARY_KEY}"
  api_secret: "${CLOUDINARY_SECRET}"

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

ADMIN_EMAIL: "${ADMIN_EMAIL}"
ADMIN_PASSWORD: "${ADMIN_PASSWORD}"

app:
  cookie:
    secure: false
    # localhost:5173 e localhost:8080 são o mesmo "site" — Strict funciona em dev
    same-site: "Strict"
